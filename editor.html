<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пишущая машинка 7.6 | Eric North</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #121212; --panel-bg: #1e1e1e; --border: #333333;
            --text-main: #e0e0e0; --accent: #ff500a; --accent-hover: #ff8c61;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Source Sans Pro', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; transition: background-color 0.5s ease; }
        
        /* Верхняя панель */
        header { background-color: var(--panel-bg); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; transition: opacity 0.3s; }
        .logo { font-family: 'Merriweather', serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; color: white; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--accent); }
        
        .header-controls { display: flex; align-items: center; gap: 20px; }
        
        .mode-switch { display: flex; background: var(--bg-dark); border-radius: 30px; padding: 4px; border: 1px solid var(--border); align-items: center; gap: 5px;}
        .mode-btn { background: transparent; border: none; color: var(--text-main); padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; font-family: 'Source Sans Pro'; transition: 0.3s; }
        .mode-btn.active { background: var(--accent); color: white; }

        /* Переключатель языков */
        .lang-switch-container { display: flex; background: var(--bg-dark); border-radius: 20px; padding: 3px; border: 1px solid var(--border); }
        .lang-btn { background: transparent; border: none; color: var(--text-main); font-weight: 700; cursor: pointer; padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; transition: 0.3s; }
        .lang-btn.active { background: var(--accent); color: white; }

        /* Панель инструментов */
        .toolbar { background-color: var(--panel-bg); padding: 10px 30px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; transition: all 0.3s ease; }
        .tool-btn { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; position: relative; }
        .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        /* Класс для подсветки активного инструмента */
        .tool-btn.active-tool { color: var(--accent); border-color: var(--accent); background: rgba(255, 80, 10, 0.1); }
        
        .tool-divider { width: 1px; height: 24px; background-color: var(--border); margin: 0 5px; }

        /* Выбор шрифта */
        .font-select { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 6px; font-family: 'Source Sans Pro', sans-serif; font-size: 0.95rem; outline: none; cursor: pointer; transition: 0.2s; }
        .font-select:hover, .font-select:focus { border-color: var(--accent); }

        /* Основная область */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        .editor-container, .code-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; transition: all 0.5s ease; }
        .code-container { border-left: 1px solid var(--border); background-color: #0d0d0d; }
        
        .area-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; padding: 15px 30px; color: #888; border-bottom: 1px solid var(--border); background: var(--panel-bg); font-weight: 700; display: flex; justify-content: space-between; align-items: center; transition: opacity 0.3s; }
        
        /* Визуальный редактор */
        #visual-editor { flex: 1; padding: 40px 60px 80px 60px; overflow-y: auto; outline: none; font-family: 'Merriweather', serif; color: var(--text-main); transition: font-family 0.3s ease, padding 0.5s ease; }
        #visual-editor:empty:before { content: attr(data-placeholder); color: #666; font-style: italic; }
        
        /* СТИЛИ: РЕЖИМ БЛОГА (По умолчанию) */
        #visual-editor.mode-blog { font-size: 1.25rem; line-height: 1.8; }
        #visual-editor.mode-blog p { margin-bottom: 30px; text-indent: 0; margin-top: 0; }
        
        /* СТИЛИ: РЕЖИМ КНИГИ */
        #visual-editor.mode-book { font-size: 1.3rem; line-height: 1.9; }
        #visual-editor.mode-book p { margin-bottom: 1.5em; text-indent: 1.5em; margin-top: 0; }
        #visual-editor.mode-book p:first-of-type { text-indent: 0; } 

        /* Общие стили элементов внутри редактора */
        #visual-editor h2 { font-size: 2rem; margin-top: 60px; margin-bottom: 20px; font-weight: 700; font-family: inherit; color: white; }
        #visual-editor h3 { font-size: 1.5rem; margin-top: 40px; margin-bottom: 15px; font-weight: 700; font-family: inherit; color: #ccc; }
        #visual-editor blockquote { border-left: 4px solid var(--accent); padding-left: 20px; margin: 40px 0; font-style: italic; color: #aaa; font-size: 1.4rem; }
        #visual-editor img { max-width: 100%; border-radius: 8px; margin: 30px 0; }
        #visual-editor a { color: var(--accent); text-decoration: none; }
        #visual-editor hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
        #visual-editor ul, #visual-editor ol { margin-bottom: 30px; padding-left: 40px; }
        #visual-editor li { margin-bottom: 10px; }

        /* Подвал редактора со статистикой */
        .editor-footer { position: absolute; bottom: 0; left: 0; right: 0; background: var(--panel-bg); border-top: 1px solid var(--border); padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #888; transition: opacity 0.3s; }
        .footer-buttons { display: flex; gap: 15px; }
        .footer-btn { background: none; border: none; color: #888; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; transition: color 0.2s; }
        .footer-btn:hover { color: var(--accent); }

        /* Окно кода */
        #code-output { flex: 1; padding: 30px; font-family: 'Courier New', monospace; font-size: 1rem; color: #a5d6ff; background: transparent; border: none; resize: none; outline: none; line-height: 1.5; white-space: pre-wrap; }
        #code-output:focus { background-color: rgba(255,255,255,0.02); }
        
        .copy-btn { background: var(--accent); color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-family: 'Source Sans Pro'; font-weight: 700; transition: 0.2s; }
        .copy-btn:hover { background: var(--accent-hover); }

        /* ================= ДЗЕН РЕЖИМ ================= */
        body.zen-mode header,
        body.zen-mode .code-container,
        body.zen-mode .area-title { display: none !important; }
        
        /* Плавающая капсула статистики */
        body.zen-mode .editor-footer { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: auto; 
            background: rgba(30, 30, 30, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; 
            padding: 8px 25px; 
            opacity: 0.2; 
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            z-index: 1000;
        }
        body.zen-mode .editor-footer:hover { 
            opacity: 1; 
            background: rgba(30, 30, 30, 0.9);
        }
        
        /* Прячем кнопки "Очистить" и "Скачать" в Дзене */
        body.zen-mode .footer-buttons { display: none; }
        
        body.zen-mode #visual-editor { max-width: 800px; margin: 0 auto; padding-top: 80px; padding-left: 80px; }
        
        /* Вертикальная панель в Дзене */
        body.zen-mode .toolbar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 70px;
            flex-direction: column;
            justify-content: center;
            background: transparent;
            border: none;
            padding: 20px 0;
            z-index: 100;
            opacity: 0.15;
            transition: opacity 0.3s ease, background 0.3s;
        }
        body.zen-mode .toolbar:hover {
            opacity: 1;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        body.zen-mode #font-selector { display: none; }
        body.zen-mode .tool-divider { width: 30px; height: 1px; margin: 8px auto; }
        
        /* Кнопка выхода из Дзена */
        #exit-zen { display: none; position: fixed; top: 20px; right: 30px; background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 10px 20px; border-radius: 30px; cursor: pointer; z-index: 1000; font-family: 'Source Sans Pro'; transition: 0.3s; backdrop-filter: blur(5px); }
        #exit-zen:hover { background: var(--accent); }
        body.zen-mode #exit-zen { display: block; }

    </style>
</head>
<body>

    <button id="exit-zen" onclick="toggleZenMode()" data-lang-text="zen_exit"><i class="fa-solid fa-compress"></i> Выйти из Дзена (Esc)</button>

    <header>
        <div class="logo">
            <i class="fa-solid fa-feather-pointed" style="color: var(--accent);"></i>
            ERIC <span>NORTH</span> | <span data-lang-text="title" style="margin-left: 5px; color: white;">Пишущая машинка</span>
        </div>
        <div class="header-controls">
            <div class="mode-switch">
                <button class="mode-btn active" onclick="switchMode('blog')" id="btn-mode-blog" data-lang-text="mode_blog">Режим: Блог</button>
                <button class="mode-btn" onclick="switchMode('book')" id="btn-mode-book" data-lang-text="mode_book">Режим: Книга</button>
            </div>
            <div class="lang-switch-container">
                <button class="lang-btn active" id="lang-ru" onclick="setLang('ru')">RU</button>
                <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
            </div>
            <button onclick="resetAPIKey()" style="background: transparent; border: none; color: var(--text-main); cursor: pointer; font-size: 1.1rem; opacity: 0.5; transition: 0.3s; padding: 0 5px;" onmouseover="this.style.opacity=1; this.style.color='var(--accent)'" onmouseout="this.style.opacity=0.5; this.style.color='var(--text-main)'" data-lang-title="btn_reset_key" title="Сбросить ключ API"><i class="fa-solid fa-key"></i></button>
        </div>
    </header>

    <div class="toolbar">
        <select id="font-selector" class="font-select" onchange="changeFont()" data-lang-title="font_title" title="Выбрать шрифт">
            <option value="'Merriweather', serif" data-lang-text="font_merriweather">Шрифт: Merriweather (Сайт)</option>
            <option value="Georgia, serif" data-lang-text="font_georgia">Шрифт: Georgia (Книга)</option>
            <option value="'Source Sans Pro', Arial, sans-serif" data-lang-text="font_arial">Шрифт: Arial (Блог)</option>
            <option value="'Courier New', monospace" data-lang-text="font_courier">Шрифт: Печатная машинка</option>
        </select>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-undo" onclick="format('undo')" data-lang-title="btn_undo" title="Отменить (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="tool-btn" id="btn-redo" onclick="format('redo')" data-lang-title="btn_redo" title="Вернуть (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>

        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-p" onclick="format('formatBlock', 'P')" data-lang-title="btn_p" title="Абзац / Выйти из цитаты"><i class="fa-solid fa-paragraph"></i></button>
        <button class="tool-btn" id="btn-h2" onclick="format('formatBlock', 'H2')" data-lang-title="btn_h2" title="Заголовок 2" style="font-size: 0.85rem;"><i class="fa-solid fa-heading"></i>2</button>
        <button class="tool-btn" id="btn-h3" onclick="format('formatBlock', 'H3')" data-lang-title="btn_h3" title="Заголовок 3" style="font-size: 0.85rem;"><i class="fa-solid fa-heading"></i>3</button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-bold" onclick="format('bold')" data-lang-title="btn_bold" title="Жирный (Ctrl+B)"><i class="fa-solid fa-bold"></i></button>
        <button class="tool-btn" id="btn-italic" onclick="format('italic')" data-lang-title="btn_italic" title="Курсив (Ctrl+I)"><i class="fa-solid fa-italic"></i></button>
        <button class="tool-btn" id="btn-strike" onclick="format('strikeThrough')" data-lang-title="btn_strike" title="Зачеркнутый"><i class="fa-solid fa-strikethrough"></i></button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-align-left" onclick="format('justifyLeft')" data-lang-title="btn_align_left" title="По левому краю"><i class="fa-solid fa-align-left"></i></button>
        <button class="tool-btn" id="btn-align-center" onclick="format('justifyCenter')" data-lang-title="btn_align_center" title="По центру"><i class="fa-solid fa-align-center"></i></button>
        <button class="tool-btn" id="btn-align-right" onclick="format('justifyRight')" data-lang-title="btn_align_right" title="По правому краю"><i class="fa-solid fa-align-right"></i></button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-quote" onclick="format('formatBlock', 'BLOCKQUOTE')" data-lang-title="btn_quote" title="Цитата"><i class="fa-solid fa-quote-right"></i></button>
        <button class="tool-btn" id="btn-hr" onclick="insertRule()" data-lang-title="btn_hr" title="Линия-разделитель сцен"><i class="fa-solid fa-minus"></i></button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-ul" onclick="format('insertUnorderedList')" data-lang-title="btn_ul" title="Маркированный список"><i class="fa-solid fa-list-ul"></i></button>
        <button class="tool-btn" id="btn-ol" onclick="format('insertOrderedList')" data-lang-title="btn_ol" title="Нумерованный список"><i class="fa-solid fa-list-ol"></i></button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-link" onclick="addLink()" data-lang-title="btn_link" title="Вставить ссылку"><i class="fa-solid fa-link"></i></button>
        <button class="tool-btn" id="btn-img" onclick="addImage()" data-lang-title="btn_img" title="Вставить картинку"><i class="fa-regular fa-image"></i></button>
        <button class="tool-btn" id="btn-audio" onclick="addAudio()" data-lang-title="btn_audio" title="Вставить Аудиоплеер"><i class="fa-solid fa-headphones"></i></button>
        <button class="tool-btn" id="btn-html" onclick="insertRawHTML()" data-lang-title="btn_html" title="Вставить HTML-код как визуальный элемент"><i class="fa-solid fa-code"></i></button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-translate" onclick="translateGemini()" data-lang-title="btn_translate" title="Перевести с помощью Gemini AI"><i class="fa-solid fa-language"></i></button>
        
        <div class="tool-divider"></div>
        <button class="tool-btn" id="btn-zen" onclick="toggleZenMode()" data-lang-title="btn_zen" title="Режим Фокуса (Дзен)"><i class="fa-solid fa-expand"></i></button>
    </div>

    <div class="workspace">
        <div class="editor-container">
            <div class="area-title" data-lang-text="area_visual">Визуальный редактор</div>
            <div id="visual-editor" class="mode-blog" contenteditable="true" data-lang-placeholder="placeholder_visual" data-placeholder="Начните писать вашу историю здесь..."></div>
            <div class="editor-footer">
                <div class="footer-buttons">
                    <button class="footer-btn" id="btn-clear" onclick="clearDraft()" data-lang-text="btn_clear"><i class="fa-regular fa-trash-can"></i> Очистить</button>
                    <button class="footer-btn" id="btn-download" onclick="downloadBackup()" data-lang-text="btn_download"><i class="fa-solid fa-download"></i> Сохранить в файл</button>
                </div>
                <div id="stats">Слов: 0 | Символов: 0 | Время чтения: 0 мин</div>
            </div>
        </div>
        <div class="code-container">
            <div class="area-title">
                <span data-lang-text="area_html">Чистый HTML (Можно редактировать!)</span>
                <button class="copy-btn" onclick="copyCode()" id="copy-btn" data-lang-text="btn_copy"><i class="fa-solid fa-copy"></i> Копировать код</button>
            </div>
            <textarea id="code-output" data-lang-placeholder="placeholder_html" placeholder="Вставьте сюда любой HTML-код, и он мгновенно превратится в визуальный текст слева..."></textarea>
        </div>
    </div>

                alert_empty: "The text is empty!",
                alert_select_translate: "Please select text to translate first!",
                prompt_api_key: "To translate, you need a free Gemini API key.\nGet it at aistudio.google.com.\n\nEnter your key (saved in browser):",
                msg_key_reset: "API Key successfully removed from memory!",
                confirm_clear: "Delete draft? This cannot be undone.",
                copied: "<i class=\"fa-solid fa-check\"></i> Copied!",
                stats: (w, c, t) => `Words: ${w} | Characters: ${c} | Read time: ~${t} min`
            }
        };

        let currentLang = localStorage.getItem('ericNorthEditorLang') || 'ru';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('ericNorthEditorLang', lang);
            
            document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            
            document.querySelectorAll('[data-lang-text]').forEach(el => {
                el.innerHTML = translations[lang][el.getAttribute('data-lang-text')];
            });
            document.querySelectorAll('[data-lang-title]').forEach(el => {
                el.title = translations[lang][el.getAttribute('data-lang-title')];
            });
            document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
                if(el.tagName.toLowerCase() === 'textarea') {
                    el.placeholder = translations[lang][el.getAttribute('data-lang-placeholder')];
                } else {
                    el.setAttribute('data-placeholder', translations[lang][el.getAttribute('data-lang-placeholder')]);
                }
            });
            updateStatsOnly();
        }

        // ================= БАЗОВАЯ ЛОГИКА =================
        document.execCommand('defaultParagraphSeparator', false, 'p');

        window.onload = () => {
            setLang(currentLang);
            const savedData = localStorage.getItem('ericNorthDraft');
            if (savedData) {
                editor.innerHTML = savedData;
                updateCode();
            }
            const savedFont = localStorage.getItem('ericNorthFont');
            if (savedFont) {
                document.getElementById('font-selector').value = savedFont;
                changeFont();
            }
        };

        // ================= ШПИОН ЗА КУРСОРОМ =================
        function checkActiveTools() {
            document.getElementById('btn-bold').classList.toggle('active-tool', document.queryCommandState('bold'));
            document.getElementById('btn-italic').classList.toggle('active-tool', document.queryCommandState('italic'));
            document.getElementById('btn-strike').classList.toggle('active-tool', document.queryCommandState('strikeThrough'));
            
            // Проверка выравнивания
            document.getElementById('btn-align-left').classList.toggle('active-tool', document.queryCommandState('justifyLeft'));
            document.getElementById('btn-align-center').classList.toggle('active-tool', document.queryCommandState('justifyCenter'));
            document.getElementById('btn-align-right').classList.toggle('active-tool', document.queryCommandState('justifyRight'));
            
            let tag = '';
            let node = document.getSelection().anchorNode;
            if (node) {
                let block = node.nodeType === 3 ? node.parentNode : node;
                while (block && block.id !== 'visual-editor') {
                    if(['H2','H3','BLOCKQUOTE','UL','OL','P'].includes(block.tagName)) {
                        tag = block.tagName;
                        break;
                    }
                    block = block.parentNode;
                }
            }
            document.getElementById('btn-p').classList.toggle('active-tool', tag === 'P');
            document.getElementById('btn-h2').classList.toggle('active-tool', tag === 'H2');
            document.getElementById('btn-h3').classList.toggle('active-tool', tag === 'H3');
            document.getElementById('btn-quote').classList.toggle('active-tool', tag === 'BLOCKQUOTE');
            document.getElementById('btn-ul').classList.toggle('active-tool', tag === 'UL');
            document.getElementById('btn-ol').classList.toggle('active-tool', tag === 'OL');
        }

        document.addEventListener('selectionchange', checkActiveTools);
        editor.addEventListener('keyup', checkActiveTools);
        editor.addEventListener('mouseup', checkActiveTools);


        // ================= ДЗЕН РЕЖИМ =================
        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            if(document.body.classList.contains('zen-mode')) { editor.focus(); }
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape" && document.body.classList.contains('zen-mode')) toggleZenMode();
        });

        // ================= МАГИЯ ПЕРЕВОДА GEMINI (ИСПРАВЛЕНО НА V1) =================
        async function translateGemini() {
            const selection = window.getSelection();
            const textToTranslate = selection.toString().trim();
            
            if (!textToTranslate) {
                alert(translations[currentLang].alert_select_translate);
                return;
            }

            let apiKey = localStorage.getItem('ericNorthGeminiKey');
            if (!apiKey) {
                apiKey = prompt(translations[currentLang].prompt_api_key);
                if (!apiKey) return;
                localStorage.setItem('ericNorthGeminiKey', apiKey.trim());
            }

            const isRussian = /[а-яА-ЯЁё]/.test(textToTranslate);
            const targetLanguage = isRussian ? "English" : "Russian";
            const promptText = `Translate the following text to ${targetLanguage}. Preserve the exact tone, style, and meaning. Return ONLY the translated text without any markdown formatting, comments, or quotes.\n\nText to translate:\n${textToTranslate}`;

            const btn = document.getElementById('btn-translate');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.style.pointerEvents = 'none';

            try {
                // ИЗМЕНЕНО: Используем стабильную версию API v1 и флагманскую модель gemini-1.5-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { temperature: 0.3 }
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    const exactError = data.error?.message || response.statusText;
                    alert("Ответ от серверов Google API:\n\n" + exactError + "\n\nКод ошибки: " + response.status + "\n(Если это 403, нужен VPN из-за ограничений в вашем регионе)");
                    btn.innerHTML = originalIcon;
                    btn.style.pointerEvents = 'auto';
                    return; 
                }

                const translatedText = data.candidates[0].content.parts[0].text.trim();
                document.execCommand('insertText', false, translatedText);
                updateCode();

            } catch (error) {
                console.error(error);
                alert("Произошла ошибка при соединении с Google. Проверьте интернет или включите VPN.");
            } finally {
                btn.innerHTML = originalIcon;
                btn.style.pointerEvents = 'auto';
            }
        }

        function resetAPIKey() {
            localStorage.removeItem('ericNorthGeminiKey');
            alert(translations[currentLang].msg_key_reset);
        }

        // ================= ФУНКЦИИ РЕДАКТОРА =================
        function downloadBackup() {
            const textHTML = cleanHTML(editor.innerHTML);
            if (!textHTML) { alert(translations[currentLang].alert_empty); return; }
            const blob = new Blob([textHTML], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const date = new Date();
            a.download = `Eric_North_Draft_${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function changeFont() {
            const font = document.getElementById('font-selector').value;
            editor.style.fontFamily = font;
            localStorage.setItem('ericNorthFont', font); 
        }

        function switchMode(mode) {
            document.getElementById('btn-mode-blog').classList.remove('active');
            document.getElementById('btn-mode-book').classList.remove('active');
            if (mode === 'blog') {
                document.getElementById('btn-mode-blog').classList.add('active');
                editor.className = 'mode-blog';
            } else {
                document.getElementById('btn-mode-book').classList.add('active');
                editor.className = 'mode-book';
            }
        }

        function format(command, value = null) {
            editor.focus();
            document.execCommand(command, false, value);
            updateCode();
            checkActiveTools();
        }

        function insertRule() { format('insertHorizontalRule'); }
        function addLink() { const url = prompt(translations[currentLang].prompt_link); if (url) format('createLink', url); }
        function addImage() { const url = prompt(translations[currentLang].prompt_img); if (url) format('insertImage', url); }
        function insertRawHTML() {
            const code = prompt(translations[currentLang].prompt_html);
            if (code) format('insertHTML', code);
        }

        function addAudio() {
            const url = prompt(translations[currentLang].prompt_audio);
            if (!url) return;
            const title = prompt(translations[currentLang].prompt_audio_title) || translations[currentLang].audio_default_title;
            
            const audioHTML = `
            <div data-custom="true" style="background: var(--card-bg, #1e1e1e); border: 1px solid var(--accent-color, #ff500a); border-radius: 16px; padding: 15px 25px; display: flex; align-items: center; gap: 20px; margin: 40px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div data-custom="true" style="background: var(--accent-color, #ff500a); color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;">
                    <i data-custom="true" class="fa-solid fa-headphones"></i>
                </div>
                <div data-custom="true" style="flex: 1;">
                    <div data-custom="true" style="font-family: 'Source Sans Pro', sans-serif; font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-color, #e0e0e0); letter-spacing: 0.5px;">${title}</div>
                    <audio data-custom="true" controls controlsList="nodownload" style="width: 100%; height: 35px; outline: none; border-radius: 20px;">
                        <source data-custom="true" src="${url}" type="audio/mpeg">
                    </audio>
                </div>
            </div><p><br></p>`;
            format('insertHTML', audioHTML);
        }

        // Умная очистка с сохранением выравнивания текста
        function cleanHTML(html) {
            if (!html) return "";
            let temp = document.createElement('div');
            temp.innerHTML = html;

            const elements = temp.querySelectorAll('*');
            elements.forEach(el => {
                if (el.getAttribute('data-custom') !== 'true') {
                    // Спасаем выравнивание перед удалением стилей
                    let textAlign = el.style.textAlign;
                    let alignAttr = el.getAttribute('align');

                    el.removeAttribute('style');
                    el.removeAttribute('class');
                    el.removeAttribute('dir');
                    el.removeAttribute('align');

                    // Возвращаем выравнивание обратно
                    if (textAlign) el.style.textAlign = textAlign;
                    else if (alignAttr) el.style.textAlign = alignAttr;
                }

                if (el.tagName.toLowerCase() === 'div' && el.getAttribute('data-custom') !== 'true') {
                    const p = document.createElement('p');
                    p.innerHTML = el.innerHTML;
                    if (el.style.textAlign) p.style.textAlign = el.style.textAlign; // Переносим стиль на <p>
                    el.parentNode.replaceChild(p, el);
                }
                
                if (el.tagName.toLowerCase() === 'span' && el.getAttribute('data-custom') !== 'true') {
                    const fragment = document.createDocumentFragment();
                    while(el.firstChild) { fragment.appendChild(el.firstChild); }
                    el.parentNode.replaceChild(fragment, el);
                }
            });

            let clean = temp.innerHTML;
            clean = clean.replace(/<p><br><\/p>/g, ''); 
            clean = clean.replace(/<p>&nbsp;<\/p>/g, ''); 
            clean = clean.replace(/<\/p>/gi, "</p>\n\n");
            clean = clean.replace(/<\/h2>/gi, "</h2>\n\n");
            clean = clean.replace(/<\/h3>/gi, "</h3>\n\n");
            clean = clean.replace(/<\/blockquote>/gi, "</blockquote>\n\n");
            clean = clean.replace(/<hr>/gi, "\n<hr>\n\n");
            
            clean = clean.replace(/<ul>/gi, "\n<ul>\n");
            clean = clean.replace(/<\/ul>/gi, "</ul>\n\n");
            clean = clean.replace(/<ol>/gi, "\n<ol>\n");
            clean = clean.replace(/<\/ol>/gi, "</ol>\n\n");
            clean = clean.replace(/<li>/gi, "  <li>");
            clean = clean.replace(/<\/li>/gi, "</li>\n");

            return clean.trim();
        }

        function updateStatsOnly() {
            const text = editor.innerText.trim();
            const chars = text.length;
            const words = text === "" ? 0 : text.split(/\s+/).length;
            const readTime = Math.ceil(words / 200);
            stats.innerHTML = translations[currentLang].stats(words, chars, readTime);
        }

        function updateCode() {
            const currentHTML = editor.innerHTML;
            output.value = cleanHTML(currentHTML);
            localStorage.setItem('ericNorthDraft', currentHTML);
            updateStatsOnly();
        }

        output.addEventListener('input', function() {
            editor.innerHTML = this.value;
            localStorage.setItem('ericNorthDraft', this.value);
            updateStatsOnly();
        });

        editor.addEventListener('input', updateCode);

        function clearDraft() {
            if (confirm(translations[currentLang].confirm_clear)) {
                editor.innerHTML = "";
                updateCode();
            }
        }

        function copyCode() {
            output.select();
            document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = translations[currentLang].copied;
            btn.style.background = '#28a745';
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'var(--accent)';
            }, 2000);
        }
    </script>
</body>
</html>
