<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://eaumjrfaosozzoebnlcf.supabase.co" crossorigin>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | Eric North</title>
    
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 5 L15 60 L50 95 L50 5 Z" fill="%23222222"/><path d="M50 5 L85 60 L50 95 L50 5 Z" fill="%23ff500a"/><path d="M50 40 L50 85" stroke="white" stroke-width="4" stroke-linecap="round"/></svg>'>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root { --bg-color: #ffffff; --text-color: #222222; --nav-bg: #ffffff; --accent-color: #ff500a; --accent-hover: #e04508; --border-color: #eeeeee; --secondary-text: #666666; --modal-bg: rgba(255, 255, 255, 0.95); --card-bg: #f9f9f9; --footer-bg: #f5f5f5; }
        [data-theme="dark"] { --bg-color: #121212; --text-color: #e0e0e0; --nav-bg: #1a1a1a; --accent-color: #ff6b35; --accent-hover: #ff8c61; --border-color: #333333; --secondary-text: #aaaaaa; --modal-bg: rgba(18, 18, 18, 0.95); --card-bg: #1e1e1e; --footer-bg: #1f1f1f; }
        [hidden] { display: none !important; }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease; }
        body { margin: 0; padding: 0; font-family: 'Source Sans Pro', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
        a { text-decoration: none; color: var(--text-color); }
        
        /* Шапка сайта */
        header { background-color: var(--nav-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; position: sticky; top: 0; z-index: 10000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo-link { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 45px; height: 45px; transition: transform 0.3s ease; }
        .logo-text { font-family: 'Merriweather', serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }
        .logo-text span { color: var(--accent-color); }
        .logo-link:hover .logo-svg { transform: scale(1.05); }
        [data-theme="dark"] .logo-svg { filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.3)); }
        
        .main-menu { display: flex; gap: 30px; }
        .main-menu a { font-weight: 600; font-size: 1rem; position: relative; }
        .main-menu a:hover, .main-menu a.active { color: var(--accent-color); }
        .actions { display: flex; align-items: center; gap: 20px; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-color); font-size: 1.1rem; }
        .icon-btn:hover { color: var(--accent-color); }
        .btn-subscribe { background-color: var(--accent-color); color: white; padding: 8px 20px; border-radius: 20px; font-weight: 700; border: none; cursor: pointer; transition: transform 0.2s; }
        .btn-subscribe:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .lang-switch { font-weight: 700; font-size: 0.9rem; cursor: pointer; }

        /* Модальные окна */
        .search-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--modal-bg); z-index: 20000; display: flex; justify-content: center; align-items: center; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(5px); }
        .search-modal.active { opacity: 1; pointer-events: all; }
        .close-search { position: absolute; top: 30px; right: 40px; font-size: 2rem; background: none; border: none; color: var(--text-color); cursor: pointer; }
        .search-container { width: 100%; max-width: 800px; padding: 0 20px; text-align: center; }
        .search-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--secondary-text); font-family: 'Merriweather', serif; font-size: 2rem; color: var(--text-color); padding: 10px 0; outline: none; }
        .search-input::placeholder { color: var(--secondary-text); opacity: 0.5; font-style: italic; }
        .search-hint { margin-top: 15px; color: var(--secondary-text); font-size: 0.9rem; }
        .subscribe-form { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 500px; margin: 0 auto; }
        .subscribe-input { padding: 15px; font-size: 1.2rem; border: 1px solid var(--secondary-text); background: transparent; color: var(--text-color); border-radius: 4px; }
        .subscribe-submit { padding: 15px; font-size: 1.2rem; background: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; }
        .subscribe-submit:hover { background: var(--accent-hover); }

        /* Стили самой статьи */
        main { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 80px; }
        
        .post-hero-container { width: 100%; max-width: 1000px; padding: 40px 20px 20px; margin: 0 auto; }
        .back-link { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; color: var(--secondary-text); transition: color 0.2s; margin-bottom: 30px; font-size: 1.1rem; }
        .back-link:hover { color: var(--accent-color); }
        
        .post-hero-img-wrapper { width: 100%; aspect-ratio: 21/9; border-radius: 20px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .post-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .post-article { width: 100%; max-width: 760px; padding: 0 20px; margin: 0 auto; }
        .post-meta { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .post-category { color: var(--accent-color); }
        .post-date { color: var(--secondary-text); }
        .post-meta-divider { color: var(--border-color); }
        
        .post-title { font-size: 3rem; line-height: 1.2; margin: 0 0 40px 0; color: var(--text-color); }
        
        .post-content { font-family: 'Merriweather', serif; font-size: 1.2rem; line-height: 1.8; color: var(--text-color); }
        .post-content p { margin-bottom: 1.8em; }
        .post-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .loading-state { text-align: center; padding: 100px 20px; font-size: 1.5rem; color: var(--secondary-text); font-family: 'Merriweather', serif; }

        /* НОВЫЙ БЛОК: Читать еще и Форма комментариев */
        .post-footer-blocks { width: 100%; max-width: 760px; margin: 60px auto 0; padding: 40px 20px 0; border-top: 1px solid var(--border-color); }
        .block-title { font-family: 'Merriweather', serif; font-size: 1.8rem; margin-bottom: 25px; color: var(--text-color); }
        
        .read-more-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 60px; }
        .rm-card { display: flex; flex-direction: column; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.3s, border-color 0.3s; text-decoration: none; color: inherit; }
        .rm-card:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .rm-img { height: 160px; width: 100%; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .rm-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .rm-title { font-size: 1.15rem; font-weight: 700; margin: 0; font-family: 'Merriweather', serif; line-height: 1.3; }
        
        .comment-form { display: flex; flex-direction: column; gap: 20px; }
        .form-row { display: flex; gap: 20px; }
        .comment-input, .comment-textarea { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-color); font-family: 'Source Sans Pro', sans-serif; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        .comment-input:focus, .comment-textarea:focus { border-color: var(--accent-color); }
        .comment-textarea { resize: vertical; min-height: 120px; }
        .comment-submit { align-self: flex-start; background: var(--accent-color); color: white; border: none; padding: 12px 35px; border-radius: 30px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.3s; }
        .comments-list { display: flex; flex-direction: column; gap: 18px; margin-bottom: 40px; }
        .comments-count { color: var(--secondary-text); font-weight: 400; font-size: 1rem; }
        .comment-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px 22px; }
        .comment-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
        .comment-author { font-weight: 700; }
        .comment-date { color: var(--secondary-text); font-size: 0.9rem; }
        .comment-body { line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere; }
        .comment-reply { margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--accent-color); background: var(--bg-color); border-radius: 0 8px 8px 0; }
        .comment-reply-head { color: var(--accent-color); font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .comment-note { color: var(--secondary-text); font-size: 0.92rem; margin-top: -6px; }
        .comment-status { font-weight: 600; }
        .comment-status.ok { color: #2e9d5b; }
        .comment-status.err { color: #d33; }
        .comment-submit:disabled { opacity: .6; cursor: wait; transform: none; }
        .comment-submit:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 80, 10, 0.3); }

        @media (max-width: 768px) { 
            .nav-container { flex-direction: column; gap: 15px; } 
            .footer-container { flex-direction: column; gap: 20px; text-align: center; } 
            .post-title { font-size: 2.2rem; } 
            .post-content { font-size: 1.1rem; } 
            .post-hero-img-wrapper { aspect-ratio: 16/9; border-radius: 12px; } 
            .form-row { flex-direction: column; gap: 20px; }
        }
        @media (max-width: 600px) {
            .read-more-grid { grid-template-columns: 1fr; }
            .comment-submit { width: 100%; text-align: center; }
        }

        footer { background-color: var(--footer-bg); padding: 40px 0 0 0; margin-top: auto; border-top: 1px solid var(--border-color); }
        .footer-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 0 20px 40px 20px; }
        .footer-socials { display: flex; gap: 15px; }
        .footer-socials a { font-size: 1.2rem; color: var(--secondary-text); transition: color 0.3s; }
        .footer-socials a:hover { color: var(--accent-color); }
        .copyright { width: 100%; background-color: var(--accent-color); padding: 20px 0; text-align: center; margin-top: 0; }
        .copyright p { margin: 0; font-size: 0.85rem; color: #ffffff; }
        @media (max-width: 768px) { .main-menu { flex-wrap: wrap; justify-content: center; gap: 10px 22px; } }
    </style>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

    <script>
        const translations = withUk({
            ru: { 
                home: "Главная", blog: "Блог", books: "Книги", notes: "Заметки", 
                subscribe: "Подписаться", search_placeholder: "Введите название книги или темы...", search_hint: "Нажмите Enter для поиска", 
                rights: "Все права защищены.", join_news: "Новости и обновления", subscribe_btn: "Подписаться", spam_note: "Никакого спама, только магия.",
                back_to_blog: "Назад к блогу", not_found: "Запись не найдена", loading: "Загрузка архивов...",
                read_more: "Читать еще", leave_comment: "Оставить комментарий", send_comment: "Отправить комментарий",
                comment_name: "Ваше имя", comment_email: "Ваш Email (не публикуется)", comment_placeholder: "Что думаете об этой истории?"
            },
            en: { 
                home: "Home", blog: "Blog", books: "Books", notes: "Notes", 
                subscribe: "Subscribe", search_placeholder: "Type book title or topic...", search_hint: "Press Enter to search", 
                rights: "All rights reserved.", join_news: "News & Updates", subscribe_btn: "Subscribe", spam_note: "No spam, just magic.",
                back_to_blog: "Back to Blog", not_found: "Post not found", loading: "Loading archives...",
                read_more: "Read more", leave_comment: "Leave a comment", send_comment: "Send Comment",
                comment_name: "Your Name", comment_email: "Your Email (not published)", comment_placeholder: "What do you think about this story?"
            }
        });

        let currentLang = detectLang();

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang); 
            
            const langSwitch = document.querySelector('.lang-switch');
            renderLangSwitch(lang);
            
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
            
            // Динамический перевод плейсхолдеров
            const placeholdersToTranslate = [
                { id: 'searchInput', key: 'search_placeholder' },
                { id: 'comment-name', key: 'comment_name' },
                { id: 'comment-email', key: 'comment_email' },
                { id: 'comment-text', key: 'comment_placeholder' }
            ];
            
            placeholdersToTranslate.forEach(item => {
                const el = document.getElementById(item.id);
                if (el && translations[lang][item.key]) {
                    el.placeholder = translations[lang][item.key];
                }
            });
            
            toggleLangBlocks(lang);
        }

        function toggleLanguage() { setLanguage(currentLang === 'ru' ? 'en' : 'ru'); }
        
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            if (icon) icon.className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function toggleSearch() {
            const modal = document.getElementById('searchModal');
            if (modal) { modal.classList.toggle('active'); if (modal.classList.contains('active')) setTimeout(() => document.getElementById('searchInput').focus(), 100); }
        }

        function toggleSubscribe() {
            const modal = document.getElementById('subscribeModal');
            if (modal) modal.classList.toggle('active');
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                const searchModal = document.getElementById('searchModal');
                const subModal = document.getElementById('subscribeModal');
                if (searchModal) searchModal.classList.remove('active');
                if (subModal) subModal.classList.remove('active');
            }
        });

        // Инициализация языка и темы
        setLanguage(currentLang);
        const icon = document.getElementById('theme-icon');
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        if (icon) icon.className = currentTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

        // --- Комментарии: показываем одобренные, новые уходят на модерацию в админку ---
        const COMMENT_TXT = {
            sending: { ru: 'Отправляем…', en: 'Sending…', uk: 'Надсилаємо…' },
            ok: { ru: 'Спасибо! Комментарий отправлен и появится после проверки.', en: 'Thank you! Your comment was sent and will appear after review.', uk: 'Дякуємо! Коментар надіслано, він з\'явиться після перевірки.' },
            too_many: { ru: 'Слишком много комментариев подряд. Попробуйте чуть позже.', en: 'Too many comments in a row. Please try again a bit later.', uk: 'Забагато коментарів поспіль. Спробуйте трохи пізніше.' },
            bad_email: { ru: 'Проверьте адрес email.', en: 'Please check your email address.', uk: 'Перевірте адресу email.' },
            error: { ru: 'Не удалось отправить. Попробуйте ещё раз.', en: 'Could not send. Please try again.', uk: 'Не вдалося надіслати. Спробуйте ще раз.' },
            reply: { ru: 'Ответ автора', en: "Author's reply", uk: 'Відповідь автора' },
        };
        const ctxt = k => COMMENT_TXT[k][currentLang] || COMMENT_TXT[k].en;
        const cEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        function commentLangSpans(key) {
            return ['ru', 'en', 'uk'].map(l => `<span class="lang-${l}"${l === currentLang ? '' : ' hidden'}>${cEsc(COMMENT_TXT[key][l])}</span>`).join('');
        }
        async function loadComments(postId) {
            try {
                const r = await fetch(`${SUPABASE_URL}/rest/v1/comments?select=id,name,body,admin_reply,created_at&post_id=eq.${encodeURIComponent(postId)}&order=created_at.asc`, { headers: { apikey: SUPABASE_KEY } });
                if (!r.ok) return;
                const list = await r.json();
                const box = document.getElementById('comments-box');
                if (!box || !list.length) return;
                document.getElementById('comments-count').textContent = `(${list.length})`;
                const locale = { ru: 'ru-RU', en: 'en-US', uk: 'uk-UA' }[currentLang] || 'en-US';
                document.getElementById('comments-list').innerHTML = list.map(c => `
                    <div class="comment-item">
                        <div class="comment-head"><span class="comment-author">${cEsc(c.name)}</span>
                        <span class="comment-date">${cEsc(new Date(c.created_at).toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' }))}</span></div>
                        <div class="comment-body">${cEsc(c.body)}</div>
                        ${c.admin_reply ? `<div class="comment-reply"><div class="comment-reply-head">${commentLangSpans('reply')}</div><div class="comment-body">${cEsc(c.admin_reply)}</div></div>` : ''}
                    </div>`).join('');
                box.hidden = false;
            } catch (e) { console.error('Комментарии не загрузились', e); }
        }
        function setupComments(postId) {
            loadComments(postId);
            const form = document.getElementById('comment-form');
            if (!form) return;
            form.addEventListener('submit', async e => {
                e.preventDefault();
                const status = document.getElementById('comment-status');
                const btn = form.querySelector('.comment-submit');
                btn.disabled = true; status.className = 'comment-status'; status.textContent = ctxt('sending');
                try {
                    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_comment`, {
                        method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ p_post_id: postId, p_name: form.querySelector('#comment-name').value, p_email: form.querySelector('#comment-email').value,
                            p_body: form.querySelector('#comment-text').value, p_lang: currentLang, p_trap: (form.querySelector('[name="bot-field"]') || {}).value || '' }),
                    });
                    if (!r.ok) {
                        const msg = (await r.json().catch(() => ({}))).message || '';
                        throw new Error(/too_many/.test(msg) ? 'too_many' : /bad_email/.test(msg) ? 'bad_email' : 'error');
                    }
                    form.querySelector('#comment-text').value = '';
                    status.className = 'comment-status ok'; status.textContent = ctxt('ok');
                } catch (err) {
                    status.className = 'comment-status err'; status.textContent = ctxt(COMMENT_TXT[err.message] ? err.message : 'error');
                } finally { btn.disabled = false; }
            });
        }

        // Логика подгрузки конкретного поста и нижних блоков
        document.addEventListener('db-ready', () => {
            const params = new URLSearchParams(window.location.search);
            // Адрес поста: /post/<id> (или старый вид posts.html?id=<id>)
            const postId = (window.location.pathname.match(/\/post\/([A-Za-z0-9_-]+)/) || [])[1] || params.get('id');
            const mainContainer = document.getElementById('main-content');
            
            if (typeof postsDB !== 'undefined' && postId) {
                // Ищем текущий пост
                let post = null;
                let allPostsArray = [];
                
                if (typeof postsDB === 'object' && !Array.isArray(postsDB)) {
                    post = postsDB[postId];
                    allPostsArray = Object.keys(postsDB).map(k => ({id: k, ...postsDB[k]}));
                } else if (Array.isArray(postsDB)) {
                    post = postsDB.find(p => p.id === postId);
                    allPostsArray = postsDB;
                }

                if (post) {
                    const fallbackImg = 'https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?ixlib=rb-1.2.1&auto=format&fit=crop&w=1200&q=80';
                    const categoryRu = post.meta_ru ? post.meta_ru.split('|')[0] : 'Блог';
                    const categoryEn = post.meta_en ? post.meta_en.split('|')[0] : 'Blog';
                    const categoryUk = post.meta_uk ? post.meta_uk.split('|')[0] : 'Блог';
                    
                    document.title = (post['title_' + currentLang] || post.title_en) + " | Eric North";

                    // 1. Отрисовка самого поста
                    mainContainer.innerHTML = `
                        <div class="post-hero-container">
                            <a href="blog.html" class="back-link">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span data-translate="back_to_blog">Назад к блогу</span>
                            </a>
                            <div class="post-hero-img-wrapper">
                                <img src="${post.image || fallbackImg}" alt="${altText(post.title_ru, post.title_en, post.title_uk)}" class="post-hero-img">
                            </div>
                        </div>
                        
                        <article class="post-article">
                            <div class="post-meta">
                                <span class="post-category">
                                    <span class="lang-ru">${categoryRu}</span>
                                    <span class="lang-en" hidden>${categoryEn}</span><span class="lang-uk" hidden>${categoryUk}</span>
                                </span>
                                <span class="post-meta-divider">•</span>
                                <span class="post-date">2026</span>
                            </div>
                            
                            <h1 class="post-title">
                                <span class="lang-ru">${post.title_ru}</span>
                                <span class="lang-en" hidden>${post.title_en}</span><span class="lang-uk" hidden>${post.title_uk}</span>
                            </h1>
                            
                            <div class="post-content">
                                <div class="lang-ru">${post.body_ru}</div>
                                <div class="lang-en" hidden>${post.body_en}</div>
                                <div class="lang-uk" hidden>${post.body_uk}</div>
                            </div>
                        </article>
                    `;
                    
                    // 2. Вставка подвала (Читать еще + Форма)
                    const template = document.getElementById('post-footer-template');
                    mainContainer.appendChild(template.content.cloneNode(true));
                    
                    // 3. Заполняем скрытое поле формы названием поста (чтобы знать, откуда комментарий)
                    const formTitleField = document.getElementById('form-post-title');
                    if (formTitleField) formTitleField.value = post.title_ru || postId;
                    setupComments(postId);
                    
                    // 4. Логика блока "Читать еще"
                    const rmGrid = document.getElementById('read-more-grid');
                    if (rmGrid) {
                        // Фильтруем другие посты (скрываем текущий и скрытые)
                        const otherPosts = allPostsArray.filter(p => 
                            p.id !== postId && 
                            p.id !== 'featured' && 
                            p.hidden !== true && p.hidden !== 'true' && 
                            p.hidden !== 'TRUE'
                        );
                        
                        // Выбираем 2 случайных поста
                        const selectedPosts = otherPosts.sort(() => 0.5 - Math.random()).slice(0, 2);
                        
                        if (selectedPosts.length > 0) {
                            selectedPosts.forEach(sp => {
                                rmGrid.innerHTML += `
                                    <a href="post/${sp.id}" class="rm-card">
                                        <img src="${sp.image || fallbackImg}" class="rm-img">
                                        <div class="rm-content">
                                            <h4 class="rm-title">
                                                <span class="lang-ru">${sp.title_ru}</span>
                                                <span class="lang-en" hidden>${sp.title_en}</span><span class="lang-uk" hidden>${sp.title_uk}</span>
                                            </h4>
                                        </div>
                                    </a>
                                `;
                            });
                        } else {
                            // Если других постов нет, прячем весь блок с сеткой
                            rmGrid.style.display = 'none';
                            document.querySelector('[data-translate="read_more"]').style.display = 'none';
                        }
                    }

                } else {
                    mainContainer.innerHTML = `
                        <div class="loading-state">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 15px; color: var(--accent-color);"></i><br>
                            <span data-translate="not_found">Запись не найдена</span>
                        </div>
                    `;
                }
                setLanguage(currentLang);
            }
        });
    </script>
</body>
</html>
