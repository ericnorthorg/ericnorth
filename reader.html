<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader | Eric North</title>
    
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 5 L15 60 L50 95 L50 5 Z" fill="%23222222"/><path d="M50 5 L85 60 L50 95 L50 5 Z" fill="%23ff500a"/><path d="M50 40 L50 85" stroke="white" stroke-width="4" stroke-linecap="round"/></svg>'>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root { --bg-color: #fcfcfc; --text-color: #222222; --nav-bg: #ffffff; --accent-color: #ff500a; --border-color: #eeeeee; --secondary-text: #666666; --panel-bg: #ffffff; }
        [data-theme="dark"] { --bg-color: #121212; --text-color: #e0e0e0; --nav-bg: #1a1a1a; --accent-color: #ff6b35; --border-color: #333333; --secondary-text: #aaaaaa; --panel-bg: #1e1e1e; }
        [hidden] { display: none !important; }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease; }
        
        body { margin: 0; padding: 0; font-family: 'Source Sans Pro', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: var(--text-color); }
        
        /* КРАСИВЫЙ СКРОЛЛБАР */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }
        [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        /* ПРОГРЕСС-БАР ЧТЕНИЯ */
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: transparent; z-index: 2000; }
        .progress-bar { height: 3px; background: var(--accent-color); width: 0%; border-top-right-radius: 2px; border-bottom-right-radius: 2px; }

        header { background-color: var(--nav-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; position: sticky; top: 0; z-index: 1000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; position: relative; }
        
        .back-link { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; color: var(--secondary-text); transition: color 0.2s; }
        .back-link:hover { color: var(--accent-color); }
        
        .actions { display: flex; align-items: center; gap: 20px; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-color); font-size: 1.1rem; }
        .icon-btn:hover { color: var(--accent-color); }
        .lang-switch { font-weight: 700; font-size: 0.9rem; cursor: pointer; }

        /* ПАНЕЛЬ НАСТРОЕК ТЕКСТА */
        .settings-panel { position: absolute; top: 50px; right: 0; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; z-index: 1000; min-width: 260px; opacity: 0; pointer-events: none; transform: translateY(-10px); transition: all 0.3s ease; }
        .settings-panel.active { opacity: 1; pointer-events: all; transform: translateY(0); }
        .settings-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: 600; }
        .settings-controls { display: flex; gap: 8px; }
        .setting-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600; font-size: 1rem; }
        .setting-btn:hover, .setting-btn.active { border-color: var(--accent-color); color: var(--accent-color); background: rgba(255, 80, 10, 0.05); }

        main { flex: 1; padding: 60px 20px; width: 100%; display: flex; justify-content: center; }
        .reader-container { max-width: 680px; width: 100%; }
        
        .chapter-header { text-align: center; margin-bottom: 50px; }
        .chapter-title { font-family: 'Merriweather', serif; font-size: 2.5rem; line-height: 1.3; margin: 0; color: var(--text-color); transition: font-size 0.3s; }
        
        .chapter-content { font-family: 'Merriweather', serif; font-size: 1.3rem; line-height: 1.9; color: var(--text-color); transition: font-size 0.3s, font-family 0.3s; }
        .chapter-content p { margin-bottom: 1.5em; text-indent: 1.5em; text-align: justify; }
        .chapter-content p:first-of-type { text-indent: 0; }

        .reader-pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 80px; padding-top: 30px; border-top: 1px solid var(--border-color); }
        .page-btn { padding: 12px 25px; border: 1px solid var(--border-color); border-radius: 30px; font-weight: 600; color: var(--text-color); transition: all 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .page-btn:hover { border-color: var(--accent-color); color: var(--accent-color); transform: translateY(-2px); }
        .page-btn.disabled { visibility: hidden; pointer-events: none; }

        @media (max-width: 768px) { header { padding: 15px 20px; } .chapter-title { font-size: 2rem; } .chapter-content p { text-align: left; } .settings-panel { position: fixed; top: auto; bottom: 0; right: 0; left: 0; width: 100%; border-radius: 20px 20px 0 0; transform: translateY(100%); } .settings-panel.active { transform: translateY(0); } }
    </style>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <header>
        <div class="nav-container">
            <a href="books.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                <span data-translate="back_to_books">К списку книг</span>
            </a>
            
            <div class="actions">
                <button class="icon-btn" onclick="toggleSettings()" title="Настройки текста" data-translate-title="settings_title"><i class="fa-solid fa-font"></i></button>
                
                <div id="settings-panel" class="settings-panel">
                    <div class="settings-row">
                        <span data-translate="font_size">Размер текста</span>
                        <div class="settings-controls">
                            <button class="setting-btn" onclick="changeFontSize(-0.1)">A-</button>
                            <button class="setting-btn" onclick="changeFontSize(0.1)">A+</button>
                        </div>
                    </div>
                    <div class="settings-row">
                        <span data-translate="font_family">Шрифт</span>
                        <div class="settings-controls">
                            <button class="setting-btn" id="btn-font-serif" onclick="changeFontFamily('serif')" style="font-family: 'Merriweather', serif;">Serif</button>
                            <button class="setting-btn" id="btn-font-sans" onclick="changeFontFamily('sans')" style="font-family: 'Source Sans Pro', sans-serif;">Sans</button>
                        </div>
                    </div>
                </div>

                <span class="lang-switch icon-btn" onclick="window.toggleLanguage()">EN</span>
                <button class="icon-btn" onclick="window.toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
            </div>
        </div>
    </header>

    <main>
        <article class="reader-container">
            <div id="chapter-container">
                <div class="chapter-header">
                    <h1 class="chapter-title" data-translate="loading">Загрузка...</h1>
                </div>
            </div>

            <div class="reader-pagination" id="pagination-container" style="display: none;">
                <a id="btn-prev" class="page-btn disabled">
                    <i class="fa-solid fa-arrow-left"></i> <span data-translate="prev_chapter">Предыдущая</span>
                </a>
                <a id="btn-next" class="page-btn disabled">
                    <span data-translate="next_chapter">Следующая</span> <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </article>
    </main>

    <script src="i18n.js"></script>
    <script src="cms.js"></script>

    <script>
        const translations = withUk({
            ru: { back_to_books: "К списку", loading: "Загрузка...", not_found: "Глава не найдена", prev_chapter: "Предыдущая", next_chapter: "Следующая", font_size: "Размер текста", font_family: "Шрифт", settings_title: "Настройки текста" },
            en: { back_to_books: "Back", loading: "Loading...", not_found: "Chapter not found", prev_chapter: "Previous", next_chapter: "Next", font_size: "Font Size", font_family: "Font Family", settings_title: "Text Settings" }
        }, { not_found: 'Розділ не знайдено', loading: 'Завантаження...' });

        window.currentLang = detectLang();

        window.setLanguage = function(lang) {
            window.currentLang = lang;
            localStorage.setItem('lang', lang); 
            renderLangSwitch(lang);
            
            // Перевод текстовых блоков
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
            
            // Перевод всплывающих подсказок (title)
            document.querySelectorAll('[data-translate-title]').forEach(el => {
                const key = el.getAttribute('data-translate-title');
                if (translations[lang] && translations[lang][key]) el.title = translations[lang][key];
            });
            
            toggleLangBlocks(lang);
        };

        window.toggleLanguage = function() { window.setLanguage(window.currentLang === 'ru' ? 'en' : 'ru'); };

        window.toggleTheme = function() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            if (icon) icon.className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        };

        // --- ЛОГИКА НАСТРОЕК ТЕКСТА ---
        let currentFontSize = parseFloat(localStorage.getItem('readerFontSize')) || 1.3;
        let currentFontFamily = localStorage.getItem('readerFontFamily') || 'serif';

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('active');
        }

        function changeFontSize(step) {
            currentFontSize += step;
            if (currentFontSize < 0.9) currentFontSize = 0.9;
            if (currentFontSize > 2.5) currentFontSize = 2.5;
            
            const content = document.querySelector('.chapter-content');
            if(content) content.style.fontSize = currentFontSize + 'rem';
            localStorage.setItem('readerFontSize', currentFontSize);
        }

        function changeFontFamily(type) {
            currentFontFamily = type;
            const content = document.querySelector('.chapter-content');
            
            if (type === 'serif') {
                if(content) content.style.fontFamily = "'Merriweather', serif";
                document.getElementById('btn-font-serif').classList.add('active');
                document.getElementById('btn-font-sans').classList.remove('active');
            } else {
                if(content) content.style.fontFamily = "'Source Sans Pro', sans-serif";
                document.getElementById('btn-font-sans').classList.add('active');
                document.getElementById('btn-font-serif').classList.remove('active');
            }
            localStorage.setItem('readerFontFamily', type);
        }

        // Закрытие панели при клике мимо неё
        document.addEventListener('click', function(event) {
            const panel = document.getElementById('settings-panel');
            const btn = document.querySelector('.fa-font').parentElement;
            if (panel.classList.contains('active') && !panel.contains(event.target) && !btn.contains(event.target)) {
                panel.classList.remove('active');
            }
        });

        // --- ПРОГРЕСС-БАР ЧТЕНИЯ ---
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = 0;
            if (height > 0) scrolled = (winScroll / height) * 100;
            document.getElementById("myBar").style.width = scrolled + "%";
        };

        // Инициализация темы и языка
        window.setLanguage(window.currentLang);
        const icon = document.getElementById('theme-icon');
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        if (icon) icon.className = currentTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

        document.addEventListener('db-ready', () => {
            const { book: bookId, chapter: chapterNum } = readerParams();
            
            if(typeof chaptersDB !== 'undefined') {
                const container = document.getElementById('chapter-container');
                const pagContainer = document.getElementById('pagination-container');
                
                const chapter = chaptersDB.find(ch => ch.book_id === bookId && parseInt(ch.chapter_num, 10) === chapterNum);

                if(!chapter) {
                    container.innerHTML = `<div class="chapter-header"><h1 class="chapter-title" data-translate="not_found">Глава не найдена</h1></div>`;
                    window.setLanguage(window.currentLang);
                    return; 
                }

                // Сохраняем прогресс
                localStorage.setItem('lastReadBook', bookId);
                localStorage.setItem('lastReadChapter', chapterNum);

                container.innerHTML = `
                    <div class="chapter-header">
                        <h1 class="chapter-title"><span class="lang-ru">${chapter.title_ru}</span><span class="lang-en" hidden>${chapter.title_en}</span><span class="lang-uk" hidden>${chapter.title_uk}</span></h1>
                    </div>
                    <div class="chapter-content">
                        <div class="lang-ru">${chapter.text_ru}</div>
                        <div class="lang-en" hidden>${chapter.text_en}</div>
                        <div class="lang-uk" hidden>${chapter.text_uk}</div>
                    </div>
                `;
                
                // Как в seo-read.js: «Глава — Книга | Eric North», с тем же порядком запасных языков
                const pickTitle = o => { if (!o) return ''; const order = { en: ['en', 'ru', 'uk'], ru: ['ru', 'en', 'uk'], uk: ['uk', 'en', 'ru'] }[window.currentLang] || ['en', 'ru', 'uk']; for (const l of order) if (o['title_' + l]) return o['title_' + l]; return ''; };
                const bookTitle = pickTitle((typeof booksDB !== 'undefined' ? booksDB : []).find(b => b.id === bookId));
                document.title = pickTitle(chapter) + (bookTitle ? ' — ' + bookTitle : '') + ' | Eric North';

                // Применяем сохраненные настройки текста к загруженной главе
                changeFontFamily(currentFontFamily);
                document.querySelector('.chapter-content').style.fontSize = currentFontSize + 'rem';

                pagContainer.style.display = "flex";
                
                const prevChapter = chaptersDB.find(ch => ch.book_id === bookId && parseInt(ch.chapter_num, 10) === (chapterNum - 1));
                const btnPrev = document.getElementById('btn-prev');
                if (prevChapter) {
                    btnPrev.href = `read/${bookId}/${chapterNum - 1}`;
                    btnPrev.classList.remove('disabled');
                }

                const nextChapter = chaptersDB.find(ch => ch.book_id === bookId && parseInt(ch.chapter_num, 10) === (chapterNum + 1));
                const btnNext = document.getElementById('btn-next');
                if (nextChapter) {
                    btnNext.href = `read/${bookId}/${chapterNum + 1}`;
                    btnNext.classList.remove('disabled');
                }

                window.setLanguage(window.currentLang);
            }
        });
    </script>
</body>
</html>
